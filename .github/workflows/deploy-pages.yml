name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --maxWorkers=2
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for the Pages subpath
        env:
          VITE_GITHUB_PAGES: 'true'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build -- --base="$PAGES_BASE_PATH"
          touch dist/.nojekyll
      - name: Upload downloadable website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist/
          include-hidden-files: true
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
